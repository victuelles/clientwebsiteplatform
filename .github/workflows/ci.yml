name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, format, test, build
    runs-on: ubuntu-latest
    env:
      # CI has no real secrets; skip env validation for lint and build.
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  database-and-e2e:
    name: Database tests and e2e
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local Supabase with the services the app and tests need (db, auth, rest, kong, mailpit, meta).
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor

      - name: pgTAP database tests
        run: pnpm test:db

      - name: Integration tests (code vs database)
        run: pnpm test:int

      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code src/core/supabase/database.types.ts

      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts reads the local Supabase URL and keys from `supabase status`.
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - if: always()
        run: pnpm exec supabase stop --no-backup
